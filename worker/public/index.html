<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fronts of Iron</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid #ccc; }
    td.address { font-family: monospace; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Fronts of Iron</h1>
  <p>Parties ouvertes <button id="refresh" type="button">Rafraîchir</button></p>
  <p id="status">Chargement…</p>
  <table id="games" hidden>
    <thead><tr><th>Partie</th><th>Joueurs</th><th>Adresse de l'hôte</th></tr></thead>
    <tbody></tbody>
  </table>
  <script>
    // Pas de rafraîchissement automatique : chaque liste coûte une requête
    // Worker et une requête Durable Object sur le quota gratuit quotidien.
    const status = document.getElementById("status");
    const table = document.getElementById("games");
    const tbody = table.querySelector("tbody");

    async function load() {
      status.textContent = "Chargement…";
      try {
        const response = await fetch("/api/games");
        if (!response.ok) throw new Error("HTTP " + response.status);
        const { games } = await response.json();
        tbody.replaceChildren(...games.map((game) => {
          const row = document.createElement("tr");
          for (const text of [game.name, game.players + " / " + game.maxPlayers, game.address]) {
            const cell = document.createElement("td");
            cell.textContent = text;
            row.append(cell);
          }
          row.lastChild.className = "address";
          return row;
        }));
        table.hidden = games.length === 0;
        status.textContent = games.length === 0 ? "Aucune partie ouverte." : "";
      } catch (error) {
        table.hidden = true;
        status.textContent = "Liste indisponible (" + error.message + ").";
      }
    }

    document.getElementById("refresh").addEventListener("click", load);
    load();
  </script>
</body>
</html>
