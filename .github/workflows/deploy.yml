name: Deploy Worker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Wrangler
        run: npm install -g wrangler

      # Le client est compilé dans client/dist, que le Worker sert (`[assets]`
      # de worker/wrangler.toml). `npm ci` installe aussi les workspaces
      # (packages/shared, packages/relay) que le Worker importe.
      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build -w client

      - name: Deploy Worker
        run: wrangler deploy
        working-directory: ./worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
